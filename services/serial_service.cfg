{
    "services" : [{
            "name" : "serial_service",
            "path" : ["/system/bin/sa_main", "/system/profile/serial_service.json"],
            "ondemand" : true,
            "uid" : "serial",
            "gid" : ["serial"],
            "permission" : [
                "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
                "ohos.permission.GET_BUNDLE_RESOURCES",
                "ohos.permission.LISTEN_BUNDLE_CHANGE",
                "ohos.permission.securityguard.REPORT_SECURITY_INFO"
            ],
            "apl" : "system_basic",
            "secon" : "u:r:serial_service:s0"
        }
    ],
    "jobs" : [{
            "name" : "post-fs-data",
            "cmds" : [
                "rm /data/service/el1/public/database/serial_manager/SerialRight.db",
                "rm /data/service/el1/public/database/serial_manager/SerialRight.db-dwr",
                "rm /data/service/el1/public/database/serial_manager/SerialRight.db-wal",
                "rm /data/service/el1/public/database/serial_manager/SerialRight.db-compare",
                "rm /data/service/el1/public/database/serial_manager/SerialRight.db-shm",
                "mkdir /data/service/el1/public/database/serial_manager 0770 serial serial"
            ]
        }
    ]
}
